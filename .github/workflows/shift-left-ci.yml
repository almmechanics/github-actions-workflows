name: Shift Left CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checks:
    uses: almmechanics/github-actions-workflows/.github/workflows/shift-left.yml@main
    secrets: inherit

  tag:
    name: Tag release version
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.16"

      - name: Install dependencies
        run: npm ci

      - name: Create or confirm version tag
        run: npm run version:tag